<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 450px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h2 {
      margin-top: 0;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
    }
    .hint {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }
    button {
      padding: 8px 20px;
      background: #4a90d9;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: #357abd;
    }
    .status {
      margin-top: 12px;
      font-size: 12px;
      color: #4a90d9;
    }
  </style>
</head>
<body>
  <h2>Server Settings</h2>
  
  <div class="field">
    <label for="serverUrl">llama.cpp Server URL</label>
    <input type="text" id="serverUrl" placeholder="http://localhost:8080">
    <div class="hint">Default: http://localhost:8080 (llama.cpp server)</div>
  </div>

  <div class="field">
    <label for="model">Model Name</label>
    <input type="text" id="model" placeholder="local-model">
    <div class="hint">Set to match your llama.cpp model identifier</div>
  </div>

  <button id="saveBtn">Save Settings</button>
  <div class="status" id="status"></div>

  <script src="lib/shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
